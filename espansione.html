<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<meta name="description" content="Kill Quentin: gioco di carte per due giocatori ispirato ai film di Quentin Tarantino. Due bande, trentaquattro facce, un solo vincitore.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%230b0b0c'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='%23f3c531' font-family='serif' font-weight='700'%3EKQ%3C/text%3E%3C/svg%3E">
<title>Kill Quentin · Collaboratori</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ultra&family=Abril+Fatface&family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,500&display=swap">
<style>
/* Layout: one dark "screening room" app — title cards in Tarantino yellow, white playing cards on a near-black table */
:root{
  color-scheme:dark;
  --bg:#0D0D0F; --panel:#18181C; --panel2:#222228; --line:#34343C;
  --text:#F2EDE1; --muted:#A8A396; --yellow:#F3C531; --ink:#17181C;
  --red:#C8302F; --red-soft:#F2A7A5; --gold:#E0A526; --gold-soft:#F5D98B; --gold-ink:#8A5A00;
  --win:#F3C531; --paper:#FFFFFF; --paper-line:#D5D5DA; --bar-bg:#E4E4E8;
  --f-title:'Ultra','Rockwell Extra Bold','Georgia',serif;
  --f-name:'Abril Fatface',Georgia,serif;
  --f-ui:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-ui);font-size:17px;line-height:1.35;margin:0}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.title{font-family:var(--f-title);color:var(--yellow);font-weight:400;letter-spacing:.01em;line-height:.92;margin:0;text-transform:uppercase}
.eyebrow{font-family:var(--f-title);color:var(--yellow);font-size:14px;letter-spacing:.14em;text-transform:uppercase;margin:0}
.btn{border:2px solid var(--yellow);background:var(--yellow);color:var(--ink);font-weight:700;font-size:18px;letter-spacing:.06em;text-transform:uppercase;padding:10px 20px;border-radius:4px;min-height:46px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--yellow)}
.btn.small{font-size:15px;padding:6px 12px;min-height:38px}
.btn:disabled{opacity:.35;cursor:not-allowed;filter:none}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
[hidden]{display:none!important}

/* ---------- HOME ---------- */
.home{display:flex;flex-direction:column;align-items:center;text-align:center;gap:22px;padding-top:2vh}
/* the home is an old one-sheet: folded, sun-faded paper, three-ink print */
.poster{--paper:#E6D3A8;--pink:#1B1712;--pred:#B3261E;width:min(520px,100%);position:relative;color:var(--pink);background-color:var(--paper);
  background-image:
    linear-gradient(90deg,transparent 49.7%,rgba(60,40,10,.16) 50%,rgba(255,255,255,.18) 50.3%,transparent 50.6%),
    linear-gradient(0deg,transparent 33.2%,rgba(60,40,10,.12) 33.4%,rgba(255,255,255,.14) 33.6%,transparent 33.8%),
    linear-gradient(0deg,transparent 66.4%,rgba(60,40,10,.12) 66.6%,rgba(255,255,255,.14) 66.8%,transparent 67%),
    radial-gradient(ellipse at 15% 8%,rgba(255,250,235,.55),transparent 55%),
    radial-gradient(ellipse at 90% 95%,rgba(110,70,20,.35),transparent 60%),
    radial-gradient(ellipse at 0% 100%,rgba(110,70,20,.25),transparent 45%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .25 0 0 0 0 .1 0 0 0 .35 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  padding:22px 22px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;container-type:inline-size;box-shadow:0 18px 40px rgba(0,0,0,.6);transform:rotate(-.7deg);border-radius:2px}
.poster::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 40px rgba(90,55,15,.45);border-radius:2px}
.poster .pre{font-family:var(--f-ui);font-weight:700;letter-spacing:.32em;text-transform:uppercase;font-size:clamp(11px,2.6vw,14px);margin:0}
.poster .tagline{font-family:var(--f-name);font-size:clamp(17px,4.2vw,22px);margin:0;line-height:1.15;text-wrap:balance}
.poster .ptitle{font-family:var(--f-title);font-weight:400;text-transform:uppercase;margin:4px 0 0;line-height:.86;font-size:clamp(40px,14.5cqi,92px);max-width:100%;color:var(--yellow);-webkit-text-stroke:2px var(--pink);text-shadow:5px 5px 0 var(--pred),5px 5px 0 var(--pred);letter-spacing:.01em}
.poster .psub{font-family:var(--f-title);font-size:clamp(13px,3.2vw,17px);letter-spacing:.24em;text-transform:uppercase;margin:0;color:var(--pred)}
.poster .faces{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;width:100%;margin:6px 0 2px;border:2px solid var(--pink);background:var(--pink)}
.poster .faces img{display:block;width:100%;aspect-ratio:1;object-fit:cover;filter:grayscale(1) sepia(.6) contrast(1.15) brightness(1.15)}
.poster .faces img:nth-child(odd){filter:grayscale(1) sepia(1) hue-rotate(-30deg) saturate(2.4) contrast(1.1) brightness(1.1)}
.poster .billing{font-family:var(--f-ui);font-weight:600;font-stretch:condensed;text-transform:uppercase;font-size:clamp(10.5px,2.5vw,12.5px);line-height:1.25;letter-spacing:.06em;margin:4px 0 0;text-wrap:balance}
.poster .billing b{font-weight:700}
.poster .soon{font-family:var(--f-title);color:var(--pred);text-transform:uppercase;letter-spacing:.12em;font-size:clamp(14px,3.6vw,19px);margin:4px 0 0;border-top:2px solid var(--pink);border-bottom:2px solid var(--pink);padding:4px 10px}
.poster .rating{display:flex;justify-content:space-between;width:100%;font-family:var(--f-ui);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.poster .rating span:first-child{border:1.5px solid var(--pink);padding:0 5px}
.menu{display:flex;flex-direction:column;gap:12px;width:min(360px,100%)}
.menu .btn{width:100%}
.menu .hint{font-size:14px;color:var(--muted);margin:-6px 0 0}
.setup{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px;width:min(420px,100%);text-align:left}
.setup h3{margin:0;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:90px;border:2px solid var(--line);background:var(--panel2);color:var(--text);border-radius:4px;padding:8px 10px;font-size:17px;font-weight:600;min-height:44px}
.seg button[aria-pressed="true"]{border-color:var(--yellow);color:var(--yellow)}
.seg .r[aria-pressed="true"]{border-color:var(--red);color:#FF8A86}
.seg .g[aria-pressed="true"]{border-color:var(--gold);color:var(--gold-soft)}

/* ---------- PAGES (rules, stats) ---------- */
.page{display:flex;flex-direction:column;gap:18px;max-width:720px;margin:0 auto}
.page .title{font-size:clamp(40px,8vw,64px)}
.page h2{font-family:var(--f-title);font-weight:400;color:var(--yellow);font-size:22px;margin:8px 0 0;letter-spacing:.02em}
.page p,.page li{margin:0;max-width:65ch}
.page ol,.page ul{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.just{text-align:justify;hyphens:auto}
.powers{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.powers div{background:var(--panel);border:1px solid var(--line);border-left:0;border-radius:4px;padding:10px 12px}
.powers b{display:block;color:var(--yellow);letter-spacing:.06em;text-transform:uppercase;font-size:15px}
table.st{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.tblwrap{overflow-x:auto;flex-shrink:0}
table.st th,table.st td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right}
table.st th:first-child,table.st td:first-child{text-align:left}
table.st thead th{color:var(--muted);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:14px}
table.st tr.tot td{color:var(--yellow);font-weight:700;border-bottom:0}
.codebox{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;word-break:break-all;resize:vertical;min-height:70px}
.note{font-size:15px;color:var(--muted)}
.ok{color:#9BE29B}.err{color:#FF8A86}
.confirm{background:var(--panel);border:1px solid var(--red);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:10px}

/* ---------- GAME ---------- */
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:10px}
.topbar .logo{font-family:var(--f-title);color:var(--yellow);font-size:22px;text-transform:uppercase;line-height:1}
.phase{font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:15px}
.phase span{color:var(--yellow)}
.score{display:flex;gap:14px;font-variant-numeric:tabular-nums;font-size:18px;font-weight:700}
.score b{font-family:var(--f-title);font-weight:400;font-size:24px;color:var(--yellow)}
.side{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.side-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.who{font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:15px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.dot.R{background:var(--red)}.dot.G{background:var(--gold)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:5px 12px;font-size:15px;min-height:34px}
.chip b{color:var(--yellow);font-variant-numeric:tabular-nums}
.backs{display:flex;gap:6px}
.mini-back{width:34px;height:48px;border-radius:3px;border:1px solid var(--line);background:repeating-linear-gradient(135deg,#17181C 0 6px,var(--c) 6px 12px)}
.stage{padding:16px 0;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;min-height:200px}
.prompt{font-size:20px;font-weight:600;margin:0;max-width:60ch}
.prompt em{font-style:normal;color:var(--yellow)}
.voci{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.voci button{border:2px solid var(--line);background:var(--panel2);color:var(--text);border-radius:4px;padding:8px 12px;font-size:16px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;min-height:44px}
.voci button[aria-pressed="true"]{border-color:var(--yellow);color:var(--ink);background:var(--yellow)}
.voci button:disabled{opacity:.4;cursor:not-allowed}
.voci button.u{text-decoration:line-through}
.hand{display:flex;gap:12px;overflow-x:auto;padding:6px 2px 12px;justify-content:center;scroll-snap-type:x mandatory}
.hand>*{scroll-snap-align:center}
@media (max-width:640px){.hand{justify-content:flex-start}}
.handnav{display:none;align-items:center;gap:8px;justify-content:center;margin-top:10px;font-size:14px;color:var(--muted)}
.handnav b{color:var(--yellow)}
.handnav button{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--panel2);color:var(--text);font:700 14px/1 inherit;font-family:inherit;padding:0}
.handnav button.on{border-color:var(--yellow);color:var(--yellow)}
@media (max-width:640px){.handnav{display:flex}}
.hand .card{cursor:pointer}
.tracks{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;align-items:stretch}
.trk{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;display:flex;flex-direction:column;gap:3px;min-width:0;position:relative}
.trk .tn{font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk .tv{font-family:var(--f-title);color:var(--yellow);font-size:22px;line-height:1}
.trk .pips{display:flex;flex-wrap:wrap;gap:3px;min-height:8px;font-size:12px;color:var(--muted)}
.trk .pips i{width:8px;height:8px;border-radius:50%;background:var(--yellow)}
.trk.x{opacity:.45;border-style:dashed}
.trk.x .tv{color:var(--muted)}
.trk.off{border-color:var(--muted)}
.trk.off .tv{color:var(--muted);text-decoration:line-through}
.trk.off .pips i{background:var(--muted)}
.trk .tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tsum{grid-column:1/-1;display:flex;gap:10px;align-items:baseline;font-size:15px}
.tsum b{font-family:var(--f-title);font-weight:400;color:var(--yellow);font-size:20px}
.tsum span{color:var(--muted);font-size:13px}
.cine{position:fixed;inset:0;z-index:60;background:#000;display:flex;align-items:center;justify-content:center;text-align:center;animation:cine-bg 3.8s ease forwards;cursor:pointer;padding:16px}
.cine-in{display:flex;flex-direction:column;align-items:center;gap:14px;animation:cine-in 3.8s cubic-bezier(.2,.7,.2,1) forwards}
.cine-t{font-family:var(--f-title);font-weight:400;text-transform:uppercase;line-height:1.05;padding:.06em .12em;max-width:100vw;font-size:clamp(34px,11.5vw,190px);color:var(--yellow);-webkit-text-stroke:1px #1B1712;text-shadow:4px 4px 0 #B3261E;letter-spacing:.01em;white-space:nowrap}
.cine.lose .cine-t{color:#E8E2D2}
.cine.lose .cine-t,.cine.draw .cine-t{text-shadow:4px 4px 0 #4a1412}
.cine-s{font-family:var(--f-title);text-transform:uppercase;letter-spacing:.35em;font-size:clamp(12px,2.6vw,20px);color:#B3261E}
.cine-bar{width:min(520px,70vw);height:3px;background:var(--yellow);opacity:.8}
@keyframes cine-bg{0%{opacity:0}8%{opacity:1}82%{opacity:1}100%{opacity:0}}
@keyframes cine-in{0%{transform:scale(.7);opacity:0;letter-spacing:.2em}18%{transform:scale(1);opacity:1}100%{transform:scale(1.06);opacity:1}}
@media (prefers-reduced-motion:reduce){.cine-in{animation:none}.cine{animation-duration:3.8s}}
.legal{max-width:520px;margin:28px auto 8px;text-align:center;font-size:12px;line-height:1.5;color:var(--muted);opacity:.85}
.gamegrid{display:block}
.gmain{min-width:0}
.fab{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));z-index:20;background:var(--yellow);color:#111;border:0;border-radius:999px;padding:12px 18px;font:700 15px/1 inherit;font-family:inherit;letter-spacing:.04em;text-transform:uppercase;min-height:48px;box-shadow:0 4px 16px rgba(0,0,0,.6);cursor:pointer}
@media (min-width:1000px){
  .gamegrid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px;align-items:start}
  .gside{grid-column:2;grid-row:1;position:sticky;top:12px}
  .gmain{grid-column:1;grid-row:1}
  .gside .board{margin-top:0}
  .fab{display:none}
}
.board{display:grid;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-top:12px;width:100%}
.bhead,.bfoot{display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline;gap:8px;font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.bhead span:first-child,.bfoot span:first-child{text-align:left}.bhead span:last-child,.bfoot span:last-child{text-align:right}
.bhead span:nth-child(2){color:var(--muted);font-size:13px}
.bfoot b{font-family:var(--f-title);font-weight:400;color:var(--yellow);font-size:22px}
.bfoot .bt{color:var(--muted);font-size:12px;text-transform:none;letter-spacing:0;font-weight:500;text-align:center}
.brow{display:grid;grid-template-columns:1fr 108px 1fr;gap:8px;align-items:center}
.brow.x{opacity:.45}
.brow.bonus .bc{justify-content:flex-start}.brow.bonus .bv{color:var(--yellow)}
.bn{text-align:center;font-weight:600;color:var(--muted);font-size:13px;white-space:nowrap}
.brow.x .bn{grid-column:1/-1}
.bc{display:flex;align-items:center;gap:7px;min-height:24px;padding:2px 4px;border-radius:4px}
.bc.you{flex-direction:row-reverse}
.bc .pips{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.bc .pips i{width:9px;height:9px;border-radius:50%;background:var(--pc)}
.bc.you .pips{flex-direction:row-reverse}
.bc .bv{font-family:var(--f-title);font-size:19px;line-height:1;min-width:1.1em;text-align:center;color:var(--text)}
.bc.off .bv{color:var(--muted);text-decoration:line-through}
.bc.off .pips i{background:var(--muted)}
.bc.hot{background:rgba(243,197,49,.2);box-shadow:0 0 0 2px var(--yellow)}
.card[disabled]{opacity:.35;pointer-events:none}
.setup input[type=text]{background:var(--panel2);border:2px solid var(--line);color:var(--text);border-radius:4px;padding:8px 10px;font-size:18px;font-family:inherit;min-height:44px;width:100%}
.setup label{font-size:14px;color:var(--muted)}
.chips2{display:flex;gap:6px;flex-wrap:wrap}
.endtracks{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;width:100%;max-width:900px;text-align:left}
.coach{background:#2A2414;border:2px solid var(--yellow);border-radius:6px;padding:12px 14px;margin-top:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.coach p{margin:0;max-width:70ch}
.coach b{color:var(--yellow)}
.sheet.trivia-wrap{align-items:center}
.trivia{background:var(--paper2,#E6D3A8);color:#1B1712;border-radius:4px;padding:22px;width:min(460px,100%);display:flex;flex-direction:column;gap:10px;text-align:center;align-items:center;box-shadow:0 18px 40px rgba(0,0,0,.6);transform:rotate(-.6deg);margin-bottom:max(16px,env(safe-area-inset-bottom,0px))}
.trivia .eyebrow{color:#B3261E}
.trivia .tfilm{margin:0;font-family:var(--f-title);font-size:22px;line-height:1.05;text-transform:uppercase}
.trivia .tfilm span{color:#B3261E}
.trivia .ttext{margin:0;font-family:var(--f-name);font-size:19px;line-height:1.3;text-wrap:balance}
.trivia .tsrc{margin:0;font-size:13px;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.vtrack{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center;font-size:14px}
.vtrack span{color:var(--muted);letter-spacing:.1em;text-transform:uppercase;font-weight:700;margin-right:4px}
.vtrack i{font-style:normal;border:1px solid var(--yellow);color:var(--yellow);border-radius:999px;padding:2px 10px;font-weight:600}
.vtrack i.u{border-color:var(--line);color:var(--muted);text-decoration:line-through}
.actbar{display:flex;justify-content:center;padding:4px 0 14px}
.ann{display:inline-flex;gap:8px;align-items:center;background:var(--yellow);color:var(--ink);font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:6px 12px;border-radius:4px;font-size:16px}

/* reveal */
.reveal{display:flex;gap:16px;justify-content:center;flex-wrap:nowrap}
.slot{display:flex;flex-direction:column;align-items:center;gap:6px}
.slot .lab{font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:14px;color:var(--muted)}
.verdict{font-family:var(--f-title);color:var(--yellow);font-size:clamp(22px,4.5vw,34px);margin:0;line-height:1.05;text-transform:uppercase}
.verdict.lost{color:var(--muted)}
.explain{margin:0;color:var(--text);max-width:60ch}
.events{display:flex;flex-direction:column;gap:8px;width:min(640px,100%)}
.event{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;text-align:left}
.event b{color:var(--yellow);text-transform:uppercase;letter-spacing:.06em}
.picker{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 10px;justify-content:flex-start;max-width:100%}
.picker .card{cursor:pointer}

/* history */
.hist{display:flex;flex-direction:column;gap:8px;padding-top:14px}
.hist h3{margin:0;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.htrack{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}

function decodeCode(raw){

}

  if(!S.P.you.hand.length || !S.P.ai.hand.length){ S.cur = null; nextScene(); return; }
  allowed();
  if(S.opener==="you"){ S.step = canOpen("you") ? "open" : "gift"; }
  else if(!canOpen("ai")){
    const g = S.P.ai.hand.reduce((a,b)=> (PW(b)?44:strength(b)) < (PW(a)?44:strength(a)) ? b : a);
    move(S.P.ai.hand, S.P.you.won, g); S.cur = null; S.lastGift = {from:"ai", id:g}; S.step = "giftinfo";
  }
  else { const [id,v] = aiOpen(); S.cur = {opener:"ai", aiCard:id, voce:v}; if(S.X) S.cur.aiX = aiTricks(id, v); S.step = "respond"; }
}
function doGift(){ const g = UI.sel; move(S.P.you.hand, S.P.ai.won, g); S.lastGift = {from:"you", id:g}; S.cur = null; UI.sel = null; afterReveal(); }
function drawUp(k){ const p=S.P[k]; while(p.hand.length<3 && p.agenda.length) p.hand.push(p.agenda.pop()); }

/* ---------------- AI ---------------- */
function aiPool(){
  const seen = new Set([...S.P.ai.hand, ...S.P.you.won, ...S.P.ai.won, ...S.out]);
  if(S.phase===1){ S.P.you.rif.forEach(i=>seen.add(i)); S.P.ai.rif.forEach(i=>seen.add(i));
    return CARDS.filter(c=>c.deck===S.color && !seen.has(c.id)).map(c=>c.id); }
  S.P.ai.agenda.forEach(i=>seen.add(i));
  return CARDS.filter(c=>!seen.has(c.id)).map(c=>c.id);
}
function aiOpen(){
  const h = S.P.ai.hand;
  { const e = sEntry(); if(e && e.aiOpen) return e.aiOpen; }
  if(S.diff==="normale"){
    const al = allowed(); const legal = h.filter(i=>al.some(v=>v!==peak(i)));
    const pick = legal[Math.floor(Math.random()*legal.length)];
    const order = al.filter(v=>v!==peak(pick)).sort((a,b)=>C(pick).stats[b]-C(pick).stats[a]);
    return [pick, Math.random()<.6 ? order[0] : order[Math.floor(Math.random()*order.length)]];
  }
  let pool = aiPool(); const n = Math.max(1, S.P.you.hand.length);
  let best = null;
  if(isT()){
    for(const id of h) for(const v of allowed()){
      if(v===peak(id)) continue;
      const q = Math.pow(pool.length ? pool.filter(j=>beats(id,j,v)).length/pool.length : 0.5, n);
      const sc = q*gain("ai",v) - (1-q)*gain("you",v) + 0.15*q - 0.2*strength(id)/50 + (PW(id)?0.1:0);
      if(!best || sc>best[0]) best=[sc,id,v];
    }
    if(ciakOK("ai")){
      const extra = Math.max(...[0,1,2,3,4].filter(k=>k!==S.ex).map(k=>gain("you",k)));
      for(const id of h){
        const v = peak(id); if(v===S.ex) continue;
        const q = Math.pow(pool.length ? pool.filter(j=>beats(id,j,v)).length/pool.length : 0.5, n);
        const sc = q*(gain("ai",v)-0.15) - (1-q)*(gain("you",v)+extra) + 0.15*q - 0.2*strength(id)/50 - 0.1 + (PW(id)?0.1:0);
        if(sc>best[0]) best=[sc,id,v];
      }
    }
    return [best[1], best[2]];
  }
  const consider = (sc,id,v)=>{ if(!best || sc>best[0]) best=[sc,id,v]; };
  for(const id of h){
    const c = C(id);
    if(PW(id)){
      let sc = POWER_EV[PW(id)]*0.45;
      if(PW(id)==="Fuori sequenza" && !S.P.you.won.length) sc = 0.05;
      const v = allowed().filter(v=>v!==peak(id)).sort((a,b)=>c.stats[a]-c.stats[b])[0];
      if(v!==undefined) consider(sc,id,v);
    }
    for(const v of allowed()){
      if(v===peak(id)) continue;
      const q = pool.length ? pool.filter(j=>beats(id,j,v)).length/pool.length : 0.5;
      consider(Math.pow(q,n) - 0.25*strength(id)/50, id, v);
    }
  }
  return [best[1], best[2]];
}
function aiRespond(v){
  const h = S.P.ai.hand;
  { const e = sEntry(); if(e && e.aiResp!=null) return e.aiResp; }
  if(S.diff==="normale"){
    if(Math.random()<.5) return h.reduce((a,b)=>C(b).stats[v]>C(a).stats[v]?b:a);
    return h[Math.floor(Math.random()*h.length)];
  }
  const pool = aiPool();
  const vals = pool.filter(j=>peak(j)!==v).map(j=>C(j).stats[v]).sort((a,b)=>a-b);
  const thr = vals.length ? vals[Math.min(vals.length-1, Math.floor(vals.length*.8))] : 30;
  const winners = h.filter(i=>C(i).stats[v]>thr);
  const stake = isT() ? gain("ai",v)+gain("you",v) : 1;
  if(winners.length && stake>0) return winners.reduce((a,b)=> (C(b).stats[v]<C(a).stats[v] || (C(b).stats[v]===C(a).stats[v] && C(b).quota<C(a).quota)) ? b : a);
  const pw = h.filter(i=>PW(i));
  if(pw.length) return pw[0];
  return h.reduce((a,b)=> weak(b)<weak(a) ? b : a);
}
function weak(id){ return strength(id) + (S.phase===2 ? 0.4*C(id).quota : 0); }
function aiDiscard(){
  const h = S.P.ai.hand;
  { const e = sEntry(); if(e && e.aiDisc!=null) return e.aiDisc; }
  if(S.diff==="normale") return h[Math.floor(Math.random()*h.length)];
  return h.reduce((a,b)=> (PW(b)?44:strength(b)) < (PW(a)?44:strength(a)) ? b : a);
}
function aiBestSteal(pile){ return pile.reduce((a,b)=> (cardPts(b)*100+C(b).quota) > (cardPts(a)*100+C(a).quota) ? b : a); }
function aiHighQuota(h){ return h.reduce((a,b)=> C(b).quota>C(a).quota ? b : a); }

/* ---------------- scene resolution ---------------- */
function playOpen(){
  const id = UI.sel, v = UI.voce;
  S.P.you.hand = S.P.you.hand.filter(x=>x!==id);
  const r = aiRespond(v);
  S.P.ai.hand = S.P.ai.hand.filter(x=>x!==r);
  if(S.X){ const t = aiTricks(r, v); S.X.sc = {bet:{you:!!UI.xbet && freeC("you","chester"), ai:t.bet}, sx:{you:!!UI.xsx && freeC("you","sexm"), ai:t.sx}}; }
  resolve("you", id, r, v);
}
function playRespond(){
  const id = UI.sel;
  S.P.you.hand = S.P.you.hand.filter(x=>x!==id);
  S.P.ai.hand = S.P.ai.hand.filter(x=>x!==S.cur.aiCard);
  if(S.X){ const t = S.cur.aiX || {}; S.X.sc = {bet:{you:!!UI.xbet && freeC("you","chester"), ai:!!t.bet}, sx:{you:!!UI.xsx && freeC("you","sexm"), ai:!!t.sx}}; }
  resolve("ai", S.cur.aiCard, id, S.cur.voce);
}
function resolve(opener, oCard, rCard, v){
  const resp = other(opener);
  const tieAll = C(oCard).stats[v]===C(rCard).stats[v] && C(oCard).quota===C(rCard).quota;
  let w = isT() ? (beats(rCard, oCard, v) ? resp : opener) : (beats(oCard, rCard, v) ? opener : resp);
  let xb = {}, xnote = "";
  if(S.X){
    const sc = S.X.sc || {bet:{}, sx:{}};
    for(const k of ["you","ai"]){ if(sc.bet[k]) useC(k,"chester"); if(sc.sx[k]){ useC(k,"sexm"); xb[k===opener?"o":"r"] = 2; } }
    const vo2 = C(oCard).stats[v] + (xb.o||0), vr2 = C(rCard).stats[v] + (xb.r||0);
    if(vr2>vo2) w = resp; else if(vr2<vo2) w = opener;
    else if(hasC(resp,"alabama")){ w = resp; xnote = ` Valore pari: con Alabama vince chi risponde.`; }
    else w = C(rCard).quota>C(oCard).quota ? resp : opener;
    S.X.last = []; S.X.peek = false;
  }
  const l = other(w);
  const ciak = isT() && v===peak(oCard);
  if(ciak) S.ciakLeft[opener]--;
  const card = {}; card[opener]=oCard; card[resp]=rCard;
  const vo = C(oCard).stats[v] + (xb.o||0), vr = C(rCard).stats[v] + (xb.r||0);
  let why;
  if(xnote) why = `${V[v]}: ${vo} contro ${vr}.${xnote}`;
  else if(vo!==vr) why = `${V[v]}: ${vo} contro ${vr}.`;
  else if(C(oCard).quota!==C(rCard).quota) why = `${V[v]}: ${vo} pari. Decide la Quota: ${C(card.you).quota} contro ${C(card.ai).quota}.`;
  else why = `${V[v]}: ${vo} pari e anche la Quota è pari. Vince chi ${isT()?"apre":"risponde"}.`;
  S.P[w].won.push(oCard, rCard);
  if(w==="you" && !S.tutorial){ (S.ywins = S.ywins||[]).push(card.you); }
  S.used.push(v);
  S.cur = {opener, voce:v, you:card.you, ai:card.ai, winner:w, why, flipped:false, ciak};
  S.events = []; S.pending = [];
  if(S.X && S.X.sc){ for(const k of ["you","ai"]){ if(S.X.sc.sx[k]) S.events.push(`<b>Pistola nei pantaloni</b> Sex Machine: +2 alla carta di ${k==="you"?"te":NM('ai')} in ${V[v]}.`); if(S.X.sc.bet[k]) S.events.push(`<b>Scommessa</b> ${k==="you"?"Scommetti":`${NM('ai')} scommette`} con Chester su questa scena.`); } }
  const lc = card[l], pw = PW(lc);
  if(isT()){
    S.history.push({phase:S.phase, scene:S.scene, voce:v, you:card.you, ai:card.ai, winner:w});
    S.step = "reveal";
    let step = (PW(oCard) || PW(rCard)) ? 2 : 1;
    if(ciak) S.events.push(`<b>Ruolo cucito addosso</b> ${opener==="you"?"Apri":`${NM('ai')} apre`} con la voce col ciak di ${esc(C(oCard).name)}: ${V[v]}.`);
    if(pw==="Sono uno sbirro"){
      S.cur.adv = null;
      const opts = [0,1,2,3,4].filter(k=>k!==S.ex && S.T[w][k]>0);
      if(!opts.length) S.events.push(`<b>Sono uno sbirro</b> Mr. Orange era uno sbirro: ${w==="you"?"non avanzi":`${NM('ai')} non avanza`}, e non ha passi da perdere.`);
      else if(w==="ai"){ const k = opts.reduce((a,b)=> gain("ai",b,-1)>gain("ai",a,-1)?b:a); S.T.ai[k]--; S.events.push(`<b>Sono uno sbirro</b> Mr. Orange era uno sbirro: ${NM('ai')} non avanza e arretra di un passo in ${V[k]}.`); }
      else S.pending.push({type:"sbirro"});
      finishT(); return;
    }
    if(pw==="Risolvo problemi"){
      S.cur.adv = null;
      S.events.push(`<b>Risolvo problemi</b> Winston Wolf ripulisce la scena: ${w==="you"?"non avanzi":`${NM('ai')} non avanza`}.`);
      finishT(); return;
    }
    if(S.chain[w]){ step++; S.chain[w] = false; S.events.push(`<b>Catene spezzate</b> ${w==="you"?"Hai":`${NM('ai')} ha`} una scena in più da vendicare: ${w==="you"?"avanzi":"avanza"} di un passo extra.`); }
    S.T[w][v] += step; S.cur.adv = {k:w, v, n:step};
    if(pw==="Fuori sequenza"){
      if(l==="ai"){ const opts=[0,1,2,3,4].filter(k=>k!==S.ex && S.T.you[k]>0);
        if(opts.length){ const k = opts.reduce((a,b)=> (gain("ai",b)-gain("you",b,-1)) > (gain("ai",a)-gain("you",a,-1)) ? b : a); S.T.you[k]--; S.T.ai[k]++;
          S.events.push(`<b>Fuori sequenza</b> Vincent Vega torna in scena: ${NM('ai')} ti prende un passo in ${V[k]}.`); } }
      else S.pending.push({type:"fuori-t"});
    } else if(pw==="Resa dei conti"){
      if(S.P.you.hand.length && S.P.ai.hand.length) S.pending.push({type:"duello", loser:l});
    } else if(pw==="Stallo alla messicana"){
      if(S.P.you.hand.length && S.P.ai.hand.length) S.pending.push({type:"stallo", loser:l});
    } else if(pw==="Riscrivere la storia"){
      const live = [0,1,2,3,4].filter(k=>k!==S.ex);
      if(l==="ai"){
        let best = null;
        for(const a of live){ if(S.T.ai[a]<=0) continue; for(const b of live){ if(a===b) continue;
          const t = [...S.T.ai]; t[a]--; t[b]++; const g = tScore(t,S.ex)-tScore(S.T.ai,S.ex); if(g>0 && (!best||g>best[0])) best=[g,a,b]; } }
        if(best){ S.T.ai[best[1]]--; S.T.ai[best[2]]++; S.events.push(`<b>Riscrivere la storia</b> ${esc(C(lc).name)} riscrive il copione: ${NM('ai')} sposta un passo da ${V[best[1]]} a ${V[best[2]]}.`); }
        else S.events.push(`<b>Riscrivere la storia</b> ${esc(C(lc).name)} riscrive il copione, ma a ${NM('ai')} non conviene spostare nulla.`);
      } else if(live.some(k=>S.T.you[k]>0)) S.pending.push({type:"riscrivi", from:null});
      else S.events.push(`<b>Riscrivere la storia</b> Non hai ancora passi da spostare.`);
    } else if(pw==="Catene spezzate"){
      S.chain[l] = true;
      S.events.push(`<b>Catene spezzate</b> ${esc(C(lc).name)} ha perso, ma ${l==="you"?"la tua prossima scena vinta vale":`la prossima scena vinta da ${NM('ai')} vale`} un passo in più.`);
    }
    finishT(); return;
  }
  // power of the losing card (classic)
  if(pw){
    if(pw==="Fuori sequenza"){
      if(l==="ai"){ if(S.P.you.won.length){ const t=aiBestSteal(S.P.you.won); move(S.P.you.won,S.P.ai.won,t); S.events.push(`<b>Fuori sequenza</b> Vincent Vega torna in scena: ${NM('ai')} ti prende ${esc(C(t).name)}.`);} }
      else if(S.P.ai.won.length) S.pending.push({type:"fuori"});
    } else if(pw==="Resa dei conti"){
      if(S.P.you.hand.length && S.P.ai.hand.length) S.pending.push({type:"duello", loser:l});
      else S.events.push(`<b>Resa dei conti</b> Nessuno ha carte in mano: il duello non si fa.`);
    } else if(pw==="Sono uno sbirro"){
      S.poison.push(lc);
      S.events.push(l==="ai" ? `<b>Sono uno sbirro</b> Mr. Orange era uno sbirro: è tra le tue carte vinte, ma per te vale −2.` : `<b>Sono uno sbirro</b> Mr. Orange era uno sbirro: finisce tra le carte vinte di ${NM('ai')} e per lui vale −2.`);
    } else if(pw==="Stallo alla messicana"){
      if(S.P.you.hand.length && S.P.ai.hand.length) S.pending.push({type:"stallo", loser:l});
      else S.events.push(`<b>Stallo alla messicana</b> Nessuno ha carte in mano: lo stallo non scatta.`);
    }
  }
  S.history.push({phase:S.phase, scene:S.scene, voce:v, you:card.you, ai:card.ai, winner:w});
  S.step = "reveal";
}
function finishT(){ if(S.cur.ciak) S.pending.push({type:"ciak"}); autoPending(); }
function autoPending(){
  while(S.pending.length && S.pending[0].type==="ciak"){
    const opener = S.cur.opener, w = S.cur.winner, r = other(opener);
    if(w===opener){ // il ruolo ha funzionato: l'avversario può scambiare una carta della mano con una dei suoi scarti
      const pile = S.P[r].agenda, hand = S.P[r].hand;
      if(!pile.length || !hand.length){ S.events.push(`<b>Ruolo cucito addosso</b> ${opener==="you"?"Hai vinto":`${NM('ai')} ha vinto`}, ma ${r==="you"?"non hai":`${NM('ai')} non ha`} scarti da scambiare.`); S.pending.shift(); continue; }
      if(r==="ai"){
        const take = pile.reduce((a,b)=>strength(b)>strength(a)?b:a), give = hand.reduce((a,b)=>strength(b)<strength(a)?b:a);
        if(strength(take)>strength(give)){ S.P.ai.agenda = shuffle([...pile.filter(x=>x!==take), give]); hand[hand.indexOf(give)] = take;
          S.events.push(`<b>Ruolo cucito addosso</b> Hai vinto: ${NM('ai')} può scambiare e lo fa, una carta della sua mano con una dei suoi scarti.`); }
        else S.events.push(`<b>Ruolo cucito addosso</b> Hai vinto: ${NM('ai')} può scambiare una carta con i suoi scarti, ma non gli conviene.`);
        S.pending.shift(); continue;
      }
      S.pending[0] = {type:"ciak-swap"}; return;
    } else { // il ruolo è andato male: l'avversario avanza anche su un tracciato a scelta
      if(r==="ai"){
        const live=[0,1,2,3,4].filter(k=>k!==S.ex), k = live.reduce((a,b)=>gain("ai",b)>gain("ai",a)?b:a);
        S.T.ai[k]++; S.events.push(`<b>Ruolo cucito addosso</b> È andato male: ${NM('ai')} avanza anche di un passo in ${V[k]}.`); S.pending.shift(); continue;
      }
      S.pending[0] = {type:"ciak-bonus"}; return;
    }
  }
  if(S.X && S.cur && !S.pending.length && !S.cur.xpost) collabPost();
}
function move(from,to,id){ const i=from.indexOf(id); if(i>=0){ from.splice(i,1); to.push(id);} }
function outFromWon(id, holder){ const p=S.P[holder].won, i=p.indexOf(id); if(i>=0){ p.splice(i,1); S.out.push(id);} }
function swapHands(fromYou, fromAi){
  const y=S.P.you.hand, a=S.P.ai.hand;
  y.splice(y.indexOf(fromYou),1); a.splice(a.indexOf(fromAi),1); y.push(fromAi); a.push(fromYou);
}
function flipAdv(newW, extra=0){
  const a = S.cur.adv; if(!a) return;
  S.T[a.k][a.v] -= a.n; a.k = newW; a.n += extra; S.T[newW][a.v] += a.n;
}
function resolvePending(choice){
  const p = S.pending[0];
  if(p.type==="fuori-t"){
    S.T.ai[choice]--; S.T.you[choice]++;
    S.events.push(`<b>Fuori sequenza</b> Vincent Vega torna in scena: prendi un passo a ${NM('ai')} in ${V[choice]}.`);
    S.pending.shift(); UI.picked = []; autoPending(); return;
  }
  if(p.type==="riscrivi"){
    if(p.from===null){ p.from = choice; UI.picked = []; return; }
    S.T.you[p.from]--; S.T.you[choice]++;
    S.events.push(`<b>Riscrivere la storia</b> Sposti un passo da ${V[p.from]} a ${V[choice]}.`);
    S.pending.shift(); UI.picked = []; autoPending(); return;
  }
  if(p.type==="sr"){
    S.T.you[choice]++;
    S.events.push(`<b>Fratelli Gecko</b> Seth e Richie non ci stanno: avanzi di un passo in ${V[choice]}.`);
    S.pending.shift(); UI.picked = []; autoPending(); return;
  }
  if(p.type==="ciak-bonus"){
    S.T.you[choice]++;
    S.events.push(`<b>Ruolo cucito addosso</b> È andato male a ${NM('ai')}: avanzi anche di un passo in ${V[choice]}.`);
    S.pending.shift(); UI.picked = []; autoPending(); return;
  }
  if(p.type==="ciak-swap"){
    if(choice){ const [take,give] = choice, y = S.P.you;
      y.agenda = shuffle([...y.agenda.filter(x=>x!==take), give]); y.hand[y.hand.indexOf(give)] = take;
      S.events.push(`<b>Ruolo cucito addosso</b> Scambi ${esc(C(give).name)} con ${esc(C(take).name)} dei tuoi scarti.`); }
    else S.events.push(`<b>Ruolo cucito addosso</b> Non scambi nulla.`);
    S.pending.shift(); UI.picked = []; autoPending(); return;
  }
  if(p.type==="sbirro"){
    S.T.you[choice]--;
    S.events.push(`<b>Sono uno sbirro</b> Mr. Orange era uno sbirro: non avanzi e arretri di un passo in ${V[choice]}.`);
    S.pending.shift(); UI.picked = []; autoPending(); return;
  }
  if(p.type==="fuori"){
    move(S.P.ai.won, S.P.you.won, choice);
    S.events.push(`<b>Fuori sequenza</b> Vincent Vega torna in scena: prendi ${esc(C(choice).name)} da ${NM('ai')}.`);
    S.pending.shift();
  } else if(p.type==="duello"){
    const v = S.cur.voce, l = p.loser, w = other(l);
    const mine = choice, his = S.P.ai.hand.reduce((a,b)=> (C(b).stats[v]>C(a).stats[v] || (C(b).stats[v]===C(a).stats[v] && C(b).quota>C(a).quota)) ? b : a);
    S.P.you.hand = S.P.you.hand.filter(x=>x!==mine); S.P.ai.hand = S.P.ai.hand.filter(x=>x!==his);
    const dl = l==="you" ? mine : his, dw = l==="you" ? his : mine;
    const lWins = beats(dl, dw, v);
    let txt = `<b>Resa dei conti</b> Duello in ${V[v]}: tu giochi ${esc(C(mine).name)} (${C(mine).stats[v]}), ${NM('ai')} ${esc(C(his).name)} (${C(his).stats[v]}). `;
    if(lWins){
      for(const id of [S.cur.you, S.cur.ai]){ if(S.P[w].won.includes(id)) move(S.P[w].won, S.P[l].won, id); }
      S.P[l].won.push(mine, his); S.cur.winner = l; S.cur.flipped = true; S.history[S.history.length-1].winner = l;
      if(isT()){ flipAdv(l, 1); txt += l==="you" ? `Vinci il duello: la scena è tua e avanzi di ${S.cur.adv.n} in ${V[v]}.` : `${NM('ai')} vince il duello: la scena è sua e avanza di ${S.cur.adv.n} in ${V[v]}.`; }
      else txt += l==="you" ? "Vinci il duello: prendi tutte e 4 le carte." : `${NM('ai')} vince il duello e prende tutte e 4 le carte.`;
    } else {
      S.P[w].won.push(mine, his);
      if(isT()){ flipAdv(w, 1); txt += w==="you" ? `Vinci anche il duello: avanzi di ${S.cur.adv.n} in ${V[v]}.` : `${NM('ai')} vince anche il duello e avanza di ${S.cur.adv.n} in ${V[v]}.`; }
      else txt += w==="you" ? "Vinci anche il duello: prendi tutte e 4 le carte." : `${NM('ai')} vince anche il duello e prende tutte e 4 le carte.`;
    }
    S.cur.duel = {you:mine, ai:his};
    S.events.push(txt); S.pending.shift();
  } else if(p.type==="stallo"){
    const mine = choice, his = aiHighQuota(S.P.ai.hand);
    const qa = C(mine).quota, qb = C(his).quota;
    const l = p.loser, w = other(l);
    const qL = l==="you" ? qa : qb, qW = l==="you" ? qb : qa;
    let txt = `<b>Stallo alla messicana</b> Tu riveli ${esc(C(mine).name)} (Quota ${qa}), ${NM('ai')} ${esc(C(his).name)} (Quota ${qb}). `;
    if(qL > qW){
      for(const id of [S.cur.you, S.cur.ai]){ if(S.P[w].won.includes(id)) move(S.P[w].won, S.P[l].won, id); }
      S.cur.winner = l; S.cur.flipped = true;
      S.history[S.history.length-1].winner = l;
      if(isT()) flipAdv(l);
      txt += l==="you" ? "Vinci lo stallo: la scena passa a te." : `${NM('ai')} vince lo stallo: la scena passa a lui.`;
    } else txt += w==="you" ? "Lo stallo va a te: la scena resta tua." : `Lo stallo va a ${NM('ai')}: la scena resta sua.`;
    txt += " Le carte rivelate tornano in mano.";
    S.events.push(txt);
    S.pending.shift();
  }
  UI.picked = [];
  if(isT()) autoPending();
}
function afterReveal(){
  if(S.X && S.cur && !S.cur.hireDone){
    if(!S.cur.aiHired && S.cur.winner!=="you"){ S.cur.aiHired = true; aiHire(); }
    if(!S.cur.youHired && canHire("you")){ S.step = "hire"; return; }
    if(!S.cur.aiHired){ S.cur.aiHired = true; aiHire(); }
    S.cur.hireDone = true;
  }
  if(S.phase===1){
    if(S.P.you.hand.length){ S.step = "discard"; UI.sel = null; return; }
    if(S.P.ai.hand.length){ const his = aiDiscard(); S.P.ai.hand = S.P.ai.hand.filter(x=>x!==his); S.P.you.rif.push(his); }
  }
  drawUp("you"); drawUp("ai"); nextScene();
}
function doDiscard(){
  const mine = UI.sel;
  S.P.you.hand = S.P.you.hand.filter(x=>x!==mine); S.P.ai.rif.push(mine);
  let his = null;
  if(S.P.ai.hand.length){ his = aiDiscard(); S.P.ai.hand = S.P.ai.hand.filter(x=>x!==his); S.P.you.rif.push(his); }
  S.lastDiscard = {you:mine, ai:his};
  drawUp("you"); drawUp("ai");
  nextScene();
}
function nextScene(){
  S.opener = other(S.opener);
  if(S.scene<S.nS){ S.scene++; startScene(); return; }
  if(S.phase===1){ S.step = "interlude"; return; }
  finish();
}
function startRiprese(){
  for(const k of ["you","ai"]){ S.out.push(...S.P[k].agenda); S.P[k].agenda = shuffle(S.P[k].rif); S.P[k].rif = []; drawUp(k); }
  if(S.script){ S.P.you.agenda = [...TUT.rip.you]; S.P.ai.agenda = [...TUT.rip.ai]; }
  S.phase = 2; S.scene = 1; S.used = []; startScene();
}
function finish(){
  const a = score("you"), b = score("ai");
  if(a!==b){ S.result = {res: a>b?1:-1, a, b}; recordResult(S.result.res); S.step = "end"; }
  else if(isT() && tTotal("you")!==tTotal("ai")){ const ta=tTotal("you"), tb=tTotal("ai"); S.result = {res: ta>tb?1:-1, a, b, tot:[ta,tb]}; recordResult(S.result.res); S.step = "end"; }
  else if(!S.P.you.hand.length || !S.P.ai.hand.length){
    const qa = S.P.you.hand.length ? Math.max(...S.P.you.hand.map(i=>C(i).quota)) : 0, qb = S.P.ai.hand.length ? Math.max(...S.P.ai.hand.map(i=>C(i).quota)) : 0;
    S.result = {res: qa>qb?1:qa<qb?-1:0, a, b}; recordResult(S.result.res); S.step = "end";
  }
  else { S.step = "final"; UI.sel = null; }
}
function finalStallo(){
  const mine = UI.sel, his = aiHighQuota(S.P.ai.hand);
  const qa=C(mine).quota, qb=C(his).quota;
  const res = qa>qb ? 1 : qa<qb ? -1 : 0;
  S.result = {res, a:score("you"), b:score("ai"), stallo:{mine,his}};
  recordResult(res); S.step = "end";
}

    <p class="note just">Consiglio: salvalo su Google Keep, in una nota del telefono o mandalo a te stesso, così non lo perdi. Il codice cambia ogni volta che giochi: aggiornalo ogni tanto.</p>

}

const FS_OK = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
const inFS = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
function toggleFS(){
  try{
    if(inFS()){ (document.exitFullscreen || document.webkitExitFullscreen).call(document); }
    else { const el = document.documentElement; const p = (el.requestFullscreen || el.webkitRequestFullscreen).call(el); if(p && p.catch) p.catch(()=>{}); }
  }catch(e){}
}
const fsBtn = (cls) => FS_OK ? `<button type="button" class="${cls}" data-act="fs" aria-pressed="${inFS()?"true":"false"}">${inFS()?"Esci da schermo intero":"Schermo intero"}</button>` : "";
document.addEventListener("fullscreenchange", () => render());
document.addEventListener("webkitfullscreenchange", () => render());
function topbarHTML(){
  const ph = S.phase===1 ? "Provini" : "Riprese";
  return `<div class="topbar">

    <div class="phase">${ph} · scena <span>${Math.min(S.scene,S.nS)}</span> di ${S.nS}${isT()?` · esclusa <span>${V[S.ex]}</span>`:""}</div>
    <div class="score"><span>${NM("you")} <b>${score("you")}</b></span><span>${NM("ai")} <b>${score("ai")}</b></span></div>
  </div>`;
}
function sideHTML(k){
  const p = S.P[k], col = k==="you" ? S.color : S.aiColor;
  const label = NM(k);
  const rifLab = S.phase===1 ? `Rifiutati per ${k==="you"?"te":"lui"}` : "";
  return `<div class="side">
    <div class="side-head">
      <span class="who"><span class="dot ${col}"></span>${label} · mazzo ${COLOR_NAME[col]}</span>
      <div class="chips">
        <span class="chip">Agenda <b>${p.agenda.length}</b></span>
        <button class="chip" data-act="sheet" data-v="won-${k}">Carte vinte <b>${p.won.length}</b>${isT()?"":` · punti <b>${score(k)}</b>`}</button>
        ${S.phase===1 ? `<button class="chip" data-act="sheet" data-v="rif-${k}">${rifLab} <b>${p.rif.length}</b></button>` : ""}
      </div>
    </div>
    ${k==="ai" ? `<div class="backs">${p.hand.map(()=>`<span class="mini-back" style="--c:var(--${col==="R"?"red":"gold"})"></span>`).join("")}<span class="muted" style="font-size:14px;align-self:center">${p.hand.length} in mano</span></div>` : ""}
  </div>`;
}
function boardHTML(){
  const live = [0,1,2,3,4].filter(j=>j!==S.ex);
  const top = k => live.reduce((a,b)=> S.T[k][b]>S.T[k][a]?b:a);
  const tops = {you:top("you"), ai:top("ai")}, adv = S.cur && S.cur.adv && S.step==="reveal" ? S.cur.adv : null;
  const col = {you:S.color, ai:S.aiColor};
  const cell = (k,j) => { const n = S.T[k][j], off = j===tops[k] && n>0, hot = adv && adv.k===k && adv.v===j;
    return `<div class="bc ${k} ${off?"off":""} ${hot?"hot":""}" style="--pc:var(--${col[k]==="R"?"red":"gold"})" title="${V[j]}: ${n}${off?" (non conta)":""}"><span class="pips">${Array.from({length:Math.max(n,0)},()=>"<i></i>").join("")}</span><span class="bv">${n}</span></div>`; };
  const rows = [0,1,2,3,4].map(j => j===S.ex ? `<div class="brow x"><span class="bn">${V[j]} · esclusa</span></div>` : `<div class="brow">${cell("you",j)}<span class="bn">${V[j]}</span>${cell("ai",j)}</div>`).join("");
  return `<div class="board" aria-label="Tracciati"><div class="bhead"><span>${NM("you")}</span><span>Tracciati</span><span>${NM("ai")}</span></div>${rows}<div class="brow bonus"><span class="bc you"><span class="bv">+${tBonus(S.T.you,S.ex)}</span></span><span class="bn">Bonus</span><span class="bc ai"><span class="bv">+${tBonus(S.T.ai,S.ex)}</span></span></div>${S.X ? `<div class="brow bonus"><span class="bc you"><span class="bv">+${xPts("you")}</span></span><span class="bn">Collezione</span><span class="bc ai"><span class="bv">+${xPts("ai")}</span></span></div>` : ""}<div class="bfoot"><span>Punti <b>${score("you")}</b></span><span class="bt">tutti i tracciati tranne il più alto, più il bonus</span><span>Punti <b>${score("ai")}</b></span></div></div>${xPanelHTML()}`;
}
function tracksHTML(k){
  const t = S.T[k], live = [0,1,2,3,4].filter(j=>j!==S.ex);
  const top = live.reduce((a,b)=> t[b]>t[a]?b:a);
  const VS = ["Violenza","S. freddo","Dialogo","Stile","Vendetta"];
  return `<div class="tracks" aria-label="Tracciati">${VS.map((n,j)=>{
    const ex = j===S.ex, off = !ex && j===top && t[j]>0;
    return `<div class="trk ${ex?"x":""} ${off?"off":""}"><span class="tn">${n}</span><span class="tv">${ex?"—":t[j]}</span><span class="pips">${ex?"esclusa":Array.from({length:Math.max(t[j],0)},()=>"<i></i>").join("")}</span>${off?`<span class="tag">non conta</span>`:""}</div>`;
  }).join("")}<div class="tsum">Punti <b>${score(k)}</b><span>tutti i tracciati tranne il più alto</span></div></div>`;
}
function handHTML(act, hi){
  const hn = S.P.you.hand.length;
  const nav = hn>2 ? `<div class="handnav" aria-hidden="false"><span>Hai <b>${hn} carte</b>: scorri di lato</span>${S.P.you.hand.map((_,i)=>`<button type="button" class="${i===0?"on":""}" data-act="hnav" data-v="${i}" aria-label="Carta ${i+1}">${i+1}</button>`).join("")}</div>` : "";
  return nav + `<div class="hand">${S.P.you.hand.map(id=>cardHTML(id,{click:act, sel:UI.sel===id, hi, dis:blocked(id)})).join("")}</div>`;
}

function gameHTML(){
  let stage = "", hand = "", act = "";
  const st = S.step;
  if(st==="open"){
    const can = UI.sel!=null && UI.voce!=null;
    const pk = UI.sel!=null ? peak(UI.sel) : -1;
    const al = allowed(), ck = ciakOK("you"), e0 = sEntry(), mv = e0 && e0.must && e0.must.voce!=null ? e0.must.voce : null;
    stage = `<p class="prompt">${isT() ? "Apri tu la scena. Scegli una carta e la voce: chi vince avanza su quel tracciato." : "Apri tu la scena. Scegli una carta, poi annuncia una delle voci ancora libere in questo giro."}</p>
      <div class="voci" role="group" aria-label="Voce da annunciare">${V.map((n,j)=>`<button type="button" class="${!al.includes(j)?"u":""}" data-act="voce" data-v="${j}" aria-pressed="${UI.voce===j}" ${UI.sel==null||(j===pk&&!ck)||!al.includes(j)||(mv!=null&&j!==mv)?"disabled":""} title="${!al.includes(j)?(isT()?"Voce esclusa in questa partita":"Già chiamata in questo giro"):j===pk?(ck?"Ruolo cucito addosso: la voce col ciak di questa carta":"Niente typecasting: è la voce col ciak di questa carta"):""}">${n}${j===pk&&ck&&UI.sel!=null?" ★":""}</button>`).join("")}</div>
      ${ck ? `<p class="prompt" style="font-size:15px"><b>Ruolo cucito addosso</b> (una volta a partita, nelle riprese): puoi aprire con la voce col ciak della carta, segnata ★. Se vinci, ${NM('ai')} può scambiare una carta della sua mano con una dei suoi scarti. Se perdi, ${NM('ai')} avanza nella voce e anche di un passo su un tracciato a sua scelta.</p>` : ""}
      ${UI.sel!=null && !al.some(v=>v!==pk) ? `<p class="prompt" style="font-size:16px"><em>${esc(C(UI.sel).name)}</em> ha il ciak sull'unica voce libera: scegli un'altra carta.</p>` : ""}
      ${voiceTrack()}${xToggles()}`;
    act = `<button class="btn" data-act="play-open" ${can?"":"disabled"}>Gira la scena</button>`;
    hand = handHTML("pick", UI.voce);
  } else if(st==="respond"){
    stage = `<p class="prompt">${NM('ai')} apre la scena e annuncia:</p>
      <span class="ann">${V[S.cur.voce]}</span>
      ${backHTML(S.aiColor,"sm")}
      ${S.X && S.cur.aiX && S.cur.aiX.bet ? `<p class="prompt" style="font-size:15px">🎲 ${NM('ai')} scommette con Chester su questa scena.</p>` : ""}
      ${S.X && S.cur.aiX && S.cur.aiX.sx ? `<p class="prompt" style="font-size:15px">💼 ${NM('ai')} usa Sex Machine: la sua carta ha +2 in ${V[S.cur.voce]}.</p>` : ""}
      <p class="prompt">Scegli la carta con cui rispondere: la riga ${V[S.cur.voce]} è evidenziata.</p>${voiceTrack()}${xToggles()}`;
    act = `<button class="btn" data-act="play-respond" ${UI.sel!=null?"":"disabled"}>Rispondi</button>`;
    hand = handHTML("pick", S.cur.voce);
  } else if(st==="gift"){
    const al = allowed();
    stage = `<p class="eyebrow">Typecasting</p><p class="prompt">Non puoi aprire: le voci ancora libere in questo giro (<em>${al.map(v=>V[v]).join(", ")}</em>) sono la voce col ciak di tutte le tue carte. Regala una carta a tua scelta a ${NM('ai')}.</p>${voiceTrack()}`;
    act = `<button class="btn" data-act="gift" ${UI.sel!=null?"":"disabled"}>Regala</button>`;
    hand = handHTML("pick");
  } else if(st==="giftinfo"){
    stage = `<p class="eyebrow">Typecasting</p><p class="prompt">${NM('ai')} non può aprire con nessuna voce libera e ti regala una carta:</p>
      ${cardHTML(S.lastGift.id,{size:"md"})}
      <button class="btn" data-act="continue">Continua</button>`;
  } else if(st==="reveal"){
    stage = revealHTML();
  } else if(st==="hire"){
    stage = `<p class="eyebrow">Collaboratori</p><p class="prompt">Puoi assoldare un collaboratore: questo ti costa <b>${price("you")}</b> carte vinte e ne hai <b>${coins("you")}</b> da spendere. Ogni collaboratore costa una carta in più del precedente. Ne puoi avere al massimo ${X_CAP} (ora ${S.X.held.you.length}).</p>
      <p class="note just">Oltre al suo effetto, ogni collaboratore vale per la collezione: 2 dello stesso film o dello stesso simbolo danno 1 punto, 3 ne danno 3.</p>
      <div class="xgrid">${S.X.market.map(k=>xTile(k,"you",`<button class="btn small" data-act="xhire" data-v="${k}">Assolda</button>`)).join("")}</div>`;
    act = `<button class="btn ghost" data-act="xpass">Non ora</button>`;
  } else if(st==="sant"){
    stage = `<p class="eyebrow">Ammaliare</p><p class="prompt">Santanico incanta ${NM('ai')}: scegli una carta della tua mano da scambiare con una a caso dalla sua mano. Non sai quale carta riceverai.</p>`;
    act = `<button class="btn" data-act="xsant" ${UI.sel!=null?"":"disabled"}>Scambia</button><button class="btn ghost" data-act="xsant-skip">Tieni la mano</button>`;
    hand = handHTML("pick");
  } else if(st==="ted"){
    const top = S.P.you.agenda[S.P.you.agenda.length-1];
    stage = `<p class="eyebrow">Servizio in camera</p><p class="prompt">Ted ti porta la prima carta della tua agenda: <b>${esc(C(top).name)}</b>. Puoi scambiarla con una carta della mano, che finisce in fondo all'agenda.</p>${cardHTML(top,{size:"md"})}`;

}

function revealHTML(){
  const c = S.cur, w = c.winner;
  const youStamp = w==="you" ? "Vince" : "", aiStamp = w==="ai" ? "Vince" : "";
  let out = `<p class="verdict ${w==="you"?"":"lost"}">${w==="you" ? "Scena tua" : `Scena di ${NM('ai')}`}</p>
    <p class="explain">${esc(c.why)} ${c.opener==="you"?"Hai aperto tu.":`Ha aperto ${NM('ai')}.`}${c.flipped?" La scena è stata ribaltata.":""}${isT() && c.adv ? ` <b style="color:var(--yellow)">${c.adv.k==="you"?"Avanzi":`${NM('ai')} avanza`} di ${c.adv.n} in ${V[c.adv.v]}.</b>` : ""}</p>
    <div class="reveal">
      <div class="slot"><span class="lab">${NM("you")}</span>${cardHTML(c.you,{size:"lg", hi:c.voce, state: w==="you"?"win":"lose", stamp:youStamp})}</div>
      <div class="slot"><span class="lab">${NM("ai")}</span>${cardHTML(c.ai,{size:"lg", hi:c.voce, state: w==="ai"?"win":"lose", stamp:aiStamp})}</div>
    </div>`;
  if(S.events.length) out += `<div class="events">${S.events.map(e=>`<div class="event">${e}</div>`).join("")}</div>`;
  if(S.pending.length){
    const p = S.pending[0];
    const trkBtns = (k, act) => `<div class="voci">${[0,1,2,3,4].filter(j=>j!==S.ex && S.T[k][j]>0).map(j=>`<button type="button" data-act="${act}" data-v="${j}">${V[j]} · ${S.T[k][j]}</button>`).join("")}</div>`;
    if(p.type==="fuori-t"){
      out += `<div class="events"><div class="event"><b>Fuori sequenza</b> Scegli il tracciato di ${NM('ai')} da cui prendere un passo: lo aggiungi al tuo, nella stessa voce.</div></div>${trkBtns("ai","trk-steal")}`;
    } else if(p.type==="sbirro"){
      out += `<div class="events"><div class="event"><b>Sono uno sbirro</b> Hai vinto contro Mr. Orange, ma era uno sbirro: non avanzi e devi arretrare di un passo. Scegli il tracciato.</div></div>${trkBtns("you","trk-back")}`;
    } else if(p.type==="riscrivi"){
      const live = [0,1,2,3,4].filter(j=>j!==S.ex);
      if(p.from===null) out += `<div class="events"><div class="event"><b>Riscrivere la storia</b> Hai perso con ${esc(C(S.cur.you).name)}: sposta un passo da un tuo tracciato a un altro. Prima scegli da dove togliere.</div></div>${trkBtns("you","trk-from")}`;
      else out += `<div class="events"><div class="event"><b>Riscrivere la storia</b> Togli un passo da ${V[p.from]}. Ora scegli dove metterlo.</div></div><div class="voci">${live.filter(j=>j!==p.from).map(j=>`<button type="button" data-act="trk-to" data-v="${j}">${V[j]} · ${S.T.you[j]}</button>`).join("")}</div>`;
    } else if(p.type==="sr"){
      out += `<div class="events"><div class="event"><b>Fratelli Gecko</b> Hai perso la scena, ma Seth e Richie non ci stanno: avanzi di un passo su un tracciato a tua scelta.</div></div><div class="voci">${[0,1,2,3,4].filter(j=>j!==S.ex).map(j=>`<button type="button" data-act="trk-sr" data-v="${j}">${V[j]} · ${S.T.you[j]}</button>`).join("")}</div>`;
    } else if(p.type==="ciak-bonus"){
      out += `<div class="events"><div class="event"><b>Ruolo cucito addosso</b> ${NM('ai')} ha aperto con la voce col ciak e ha perso: avanzi di un passo su un tracciato a tua scelta.</div></div><div class="voci">${[0,1,2,3,4].filter(j=>j!==S.ex).map(j=>`<button type="button" data-act="trk-bonus" data-v="${j}">${V[j]} · ${S.T.you[j]}</button>`).join("")}</div>`;
    } else if(p.type==="ciak-swap"){
      out += `<div class="events"><div class="event"><b>Ruolo cucito addosso</b> ${NM('ai')} ha aperto con la voce col ciak e ha vinto: puoi scambiare una carta della tua mano con una dei tuoi scarti. Scegli prima quella da prendere, poi quella da dare, oppure rinuncia.</div></div>

      out += `<div class="events"><div class="event"><b>Fuori sequenza</b> Scegli una carta tra quelle vinte da ${NM('ai')}.</div></div>
        <div class="picker">${S.P.ai.won.map(id=>cardHTML(id,{size:"sm", click:"steal"})).join("")}</div>`;
    } else if(p.type==="duello"){

        <button class="btn" data-act="duel-go" ${UI.sel!=null?"":"disabled"}>Combatti</button>`;
    } else if(p.type==="stallo"){
      out += `<div class="events"><div class="event"><b>Stallo alla messicana</b> ${p.loser==="you"?"Nice Guy Eddie ha perso, ma tira fuori la pistola.":`Nice Guy Eddie di ${NM('ai')} ha perso, ma tira fuori la pistola.`} Scegli una carta dalla tua mano: vince la Quota più alta.</div></div>
        <div class="picker">${S.P.you.hand.map(id=>cardHTML(id,{size:"sm", click:"pick", sel:UI.sel===id, dis:blocked(id)})).join("")}</div>
        <button class="btn" data-act="stallo-go" ${UI.sel!=null?"":"disabled"}>Spara</button>`;
    }
  } else out += `<button class="btn" data-act="continue">Continua</button>`;
  return out;
}

function bestOpen(){
  const al = allowed(); let best = null;
  for(const id of S.P.you.hand) for(const v of al){ if(v===peak(id)) continue; const n = C(id).stats[v]; if(!best || n>best[2]) best=[id,v,n]; }
  return best;
}

  if(isT() && st==="reveal" && S.pending.length && ["riscrivi","ciak-bonus","ciak-swap"].includes(S.pending[0].type) && !seen("power2")) return ["power2", S.pending[0].type==="riscrivi" ? `<b>Riscrivere la storia</b>: perdere con questa carta ti permette di spostare un passo da un tracciato a un altro. Conviene togliere dal tracciato più alto, che tanto non conta, e metterlo dove sei più indietro.` : S.pending[0].type==="ciak-bonus" ? `Chi apre con il ruolo cucito addosso e perde regala all'avversario un passo in più su un tracciato a sua scelta. Scegli dove sei più indietro.` : `Chi apre con il ruolo cucito addosso e vince fa un regalo all'avversario: puoi scambiare una carta della mano con una dei tuoi scarti. Prendi la più forte e dai la più debole.`];
  if(isT() && st==="reveal" && S.events.some(e=>/Catene spezzate|Risolvo problemi/.test(e)) && !seen("power3")) return ["power3", `Un potere è scattato senza che tu debba scegliere: <b>Catene spezzate</b> dà un passo extra alla prossima scena vinta da chi l'ha perso, <b>Risolvo problemi</b> annulla l'avanzamento della scena. Lo leggi nella fascia scura della carta.`];
  if(st==="reveal" && S.pending.length && !seen("power")) return ["power", isT() ? `Una carta potere ha perso, quindi scatta il suo potere: l'effetto è scritto nella fascia scura sulla foto. Ricorda anche che una presa con una carta potere fa avanzare di 2 invece che di 1.` : `Una carta potere ha perso, quindi scatta il suo potere. Le carte potere hanno la fascia scura sulla foto con l'effetto scritto, e chi le vince le conta come 2 punti.`];
  if(st==="reveal" && !seen("reveal")) return ["reveal", isT() ? `Le carte si scoprono: quella illuminata ha vinto, e chi l'ha giocata avanza sul tracciato della voce annunciata. Guarda i tracciati: il più alto di ciascuno è barrato perché non conta. Quindi a volte vincere nella tua voce più forte non serve, e conviene aprire dove sei indietro.` : `Le carte si scoprono: quella illuminata ha vinto e chi l'ha giocata prende entrambe. In alto vedi i punti di tutti e due. In fondo alla pagina c'è lo storico di tutte le prese.`];
  if(isT() && st==="respond" && seen("respond") && !seen("deny")) return ["deny", `Quando rispondi, guarda anche i tracciati di ${NM('ai')}: se la voce annunciata gli serve, vale la pena giocare una carta forte per non farlo avanzare. Se invece per lui è il tracciato più alto, puoi risparmiare le carte buone.`];

  if(!isT() && st==="open" && S.used.length && !seen("cycle")) return ["cycle", `Il giro delle voci: ogni voce si chiama una sola volta per giro. Quelle barrate sono già uscite. Quando scarti e quando scegli cosa giocare, pensa alle voci che restano.`];

  if(st==="interlude" && !seen("interlude")) return ["interlude", `Fine dei provini. Adesso giochi con le carte che ${NM('ai')} ha scartato, più le 3 che hai in mano. Ecco perché contava cosa scartavi: lui ora ha i tuoi scarti.`];

  if(st==="end" && !seen("end")) return ["end", `Partita guidata finita. Le partite guidate non contano nelle statistiche. Ora puoi giocarne una vera dal menu.`];
  return null;
}

document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if(!el) return;
  const act = el.dataset.act, id = el.dataset.id!=null ? +el.dataset.id : null;
  if(act==="close-sheet"){ if(e.target===el || el.tagName==="BUTTON"){ UI.sheet=null; render(); } return; }
  switch(act){
    case "opt": OPTS[el.dataset.k] = el.dataset.v; save(KEY_OPTS, OPTS); break;
    case "new": newGame(); window.scrollTo(0,0); break;
    case "fs": toggleFS(); return;
    case "hnav": { const h = document.querySelector(".hand"); const c = h && h.children[+el.dataset.v]; if(c) h.scrollTo({left:c.offsetLeft-h.offsetLeft-2, behavior:"smooth"}); return; }
    case "tutorial": newGame("tut"); window.scrollTo(0,0); break;
    case "guided": newGame("guided"); window.scrollTo(0,0); break;
    case "setname": OPTS.name = SUGG[+el.dataset.v]; save(KEY_OPTS, OPTS); break;
    case "rollname": OPTS.name = randName(OPTS.name); save(KEY_OPTS, OPTS); break;
    case "tip": S.tips[el.dataset.v] = true; break;
    case "trivia-ok": S.showTrivia = false; break;
    case "resume": VIEW="game"; break;
    case "title": if(titleOK(el.dataset.v)){ OPTS.title = el.dataset.v; save(KEY_OPTS, OPTS); } break;
    case "go": VIEW = el.dataset.v; UI.msg=""; UI.confirmReset=false; window.scrollTo(0,0); break;
    case "pick": if(blocked(id)) break; UI.sel = id; if(S.step==="open" && UI.voce===peak(id) && !ciakOK("you")) UI.voce=null; break;
    case "voce": { const e1 = sEntry(); if(e1 && e1.must && e1.must.voce!=null && +el.dataset.v!==e1.must.voce) break; UI.voce = +el.dataset.v; break; }
    case "play-open": if(UI.sel!=null && UI.voce!=null){ playOpen(); UI.sel=null; } break;
    case "play-respond": if(UI.sel!=null){ playRespond(); UI.sel=null; } break;
    case "steal": resolvePending(id); break;
    case "trk-steal": case "trk-back": resolvePending(+el.dataset.v); break;
    case "inf-take": UI.picked[0] = id; break;
    case "inf-give": UI.picked[1] = id; break;
    case "inf-go": if(UI.picked[0]!=null && UI.picked[1]!=null) resolvePending([UI.picked[0],UI.picked[1]]); break;
    case "inf-skip": resolvePending(null); break;
    case "trk-bonus": case "trk-sr": resolvePending(+el.dataset.v); break;
    case "xmtoggle": UI.xmOpen = !(UI.xmOpen!==false); break;
    case "seeend": S.lastSeen = true; break;
    case "xzoom": UI.xzoom = el.dataset.v; break;
    case "xzoomx": UI.xzoom = null; break;
    case "xpopok": S.X.pops.shift(); break;
    case "xbet": UI.xbet = !UI.xbet; break;
    case "xsx": UI.xsx = !UI.xsx; break;
    case "xhire": { const k = el.dataset.v; if(canHire("you") && S.X.market.includes(k)){ hireC("you", k); xpop(k, `Hai assoldato ${esc(CC(k).n)}`); S.cur.youHired = true;
        if(k==="ted" && S.P.you.hand.length && S.P.you.agenda.length){ S.step = "ted"; UI.sel = null; }
        else if(k==="santanico" && S.P.you.hand.length && S.P.ai.hand.length){ S.step = "sant"; UI.sel = null; }
        else afterReveal(); } break; }
    case "xsant": if(UI.sel!=null){ const h = S.P.you.hand, o = S.P.ai.hand, t = o[Math.floor(Math.random()*o.length)];
        h[h.indexOf(UI.sel)] = t; o[o.indexOf(t)] = UI.sel; S.X.last.push(`<b>Ammaliare</b> Santanico incanta ${NM('ai')}: dai ${esc(C(UI.sel).name)} e prendi <b>${esc(C(t).name)}</b>.`); UI.sel = null; afterReveal(); } break;
    case "xsant-skip": UI.sel = null; afterReveal(); break;

    case "xted-skip": UI.sel = null; afterReveal(); break;

    case "stallo-go": case "duel-go": if(UI.sel!=null){ const s=UI.sel; UI.sel=null; resolvePending(s); } break;

    case "riprese": startRiprese(); break;
    case "final": if(UI.sel!=null) finalStallo(); break;
    case "sheet": UI.sheet = el.dataset.v; break;
    case "reset": UI.confirmReset = true; break;
    case "reset-no": UI.confirmReset = false; break;
    case "reset-yes": STATS = emptyStats(); save(KEY_STATS, STATS); AW = emptyAW(); save(KEY_AW, AW); OPTS.title="classico"; save(KEY_OPTS, OPTS); UI.confirmReset=false; UI.msg=""; break;
    case "copy": {
      const code = encodeCode();
      try{ await navigator.clipboard.writeText(code); UI.msg="copied"; }
      catch(err){ UI.msg="nocopy"; render(); const t=document.getElementById("code-out"); if(t){ t.focus(); t.select(); } return; }
      break; }
    case "share": try{ await navigator.share({title:"Kill Quentin", text:"Kill Quentin, il mio codice di salvataggio: "+encodeCode()}); }catch(err){ if(err && err.name!=="AbortError"){ UI.msg="nocopy"; } } break;
    case "load": {
      const r = decodeCode(document.getElementById("code-in").value);
      if(!r){ UI.msg="bad"; break; }
      STATS = r.stats; save(KEY_STATS, STATS); AW = r.aw; save(KEY_AW, AW); if(!titleOK(OPTS.title)) OPTS.title="classico"; Object.assign(OPTS, r.opts); save(KEY_OPTS, OPTS); UI.msg="loaded"; break; }
    default: return;
  }
  render();
  if(S && S.script && VIEW==="game" && ["play-open","play-respond","continue","discard","riprese","stallo-go","duel-go","trk-steal","trk-back","trk-from","trk-to","trk-bonus","inf-go","inf-skip","gift"].includes(act)) window.scrollTo({top:0});
});
document.addEventListener("scroll", e => {
  const h = e.target; if(!h || !h.classList || !h.classList.contains("hand")) return;
  const kids = [...h.children]; if(!kids.length) return;
  const step = kids.length>1 ? kids[1].offsetLeft - kids[0].offsetLeft : 1;
  const max = h.scrollWidth - h.clientWidth;
  const i = h.scrollLeft >= max-4 ? kids.length-1 : Math.round(h.scrollLeft/step);
  const nav = h.previousElementSibling; if(nav && nav.classList.contains("handnav")) [...nav.querySelectorAll("button")].forEach((b,k)=>b.classList.toggle("on",k===i));
}, true);
document.addEventListener("input", e => {
  const t = e.target; if(!t || !t.id) return;
  if(t.id==="inp-name"){ OPTS.name = t.value.slice(0,18); save(KEY_OPTS, OPTS); }
  if(t.id==="inp-cname"){ OPTS.cname = t.value.slice(0,18); save(KEY_OPTS, OPTS); }
});
document.addEventListener("keydown", e => { if(e.key==="Escape" && UI.sheet){ UI.sheet=null; render(); } });

/* ---------------- boot (keeps a game in progress across page updates) ---------------- */
function start(data){
  if(data && data.S && data.S.P){ S = data.S; VIEW = data.VIEW || "game"; }
  render();
}
window.claude?.hot?.snapshot?.(() => ({S, VIEW}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
